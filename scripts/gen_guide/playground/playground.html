<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CX Playground</title>
<link rel="icon" type="image/svg+xml" href="assets/cx-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="playground/playground.css">
</head>
<body class="cxp-body">
<!-- PLAY-3 (amending PLAY-1/PLAY-2): one page. The toolbar carries the TWO
     READINGS of the one bracketed syntax — data, code (RULED: PLAY-3; the
     owner, 2026-10-01: no separate query grouping) — and the primer's
     examples for the chosen reading — every one a conformance fixture,
     projected by primer_examples.cx, its id shown beside it. A code example
     that reads a document keeps it shown beside it, real, bound as $doc. -->
<header class="cxp-toolbar">
  <a class="cxp-brand" href="index.html" title="CX Guide">
    <svg viewBox="0 0 1254 1254" role="img" aria-label="CX"><g fill="currentColor"><path d="M217 170 H604 L603 260 H327 V1005 L581 1006 V1096 H217 Z"/><path d="M429 338 H586 L1093 992 H943 Z"/><path d="M1070 338 H928 L776 521 L846 609 Z"/><path d="M648 675 L716 761 L562 939 H419 Z"/></g></svg>
    <span>Playground</span>
  </a>
  <span class="cxp-tabs cxp-readings" role="tablist" aria-label="Reading">
    <button class="cxp-reading-tab" data-reading="data" type="button" role="tab"
            title="Data: a document alone — the text IS the value, shown as CX, JSON and XML">Data</button>
    <button class="cxp-reading-tab is-active" data-reading="code" type="button" role="tab"
            title="Code: a program — evaluated, its value shown (an error is a value too); when it reads a document, shown real beside it, bound as $doc">Code</button>
  </span>
  <span class="cxp-search-wrap">
    <input id="cxp-search" class="cxp-search" type="search" autocomplete="off"
           placeholder="Search examples…"
           aria-label="Full-text search over every offered example's id, title, source, output and reading"
           title="Search every offered example's id, title, source, output and reading — try flow, for, sequence">
    <ul id="cxp-search-results" class="cxp-search-results" hidden role="listbox"
        aria-label="Search results"></ul>
  </span>
  <select id="cxp-pick" aria-label="The primer's examples for this reading, by primer section"
          title="The primer's examples — each a conformance fixture. ← → previous/next example · ↑ ↓ previous/next section"></select>
  <button id="cxp-prev" class="cxp-btn cxp-btn-icon" type="button" title="Previous example">◀</button>
  <button id="cxp-next" class="cxp-btn cxp-btn-icon" type="button" title="Next example">▶</button>
  <button id="cxp-run"   class="cxp-btn cxp-btn-primary" type="button" disabled title="Run (Ctrl/⌘ + Enter)">Run</button>
  <button id="cxp-reset" class="cxp-btn" type="button" title="Restore the example's own text">Reset</button>
  <button id="cxp-share" class="cxp-btn" type="button" title="Copy a link that reopens exactly this text">Share</button>
  <span class="cxp-spacer"></span>
  <span id="cxp-crumb" class="cxp-crumb" aria-live="polite"></span>
</header>
<main class="cxp-main">
  <div id="cxp-divider-col" class="cxp-divider cxp-divider-col" aria-hidden="true"></div>
  <div id="cxp-divider-row" class="cxp-divider cxp-divider-row" aria-hidden="true"></div>
  <section class="cxp-pane cxp-source-pane">
    <div class="cxp-pane-head">
      <span>SOURCE</span>
      <code id="cxp-cmd" class="cxp-cmd" title="The command line the fixture runs — the same answer, natively"></code>
    </div>
    <div id="cxp-fixture" class="cxp-fixture" aria-live="polite"></div>
    <div id="cxp-doc-block" class="cxp-edit-block cxp-doc-block">
      <div class="cxp-edit-label" id="cxp-doc-label">input.cx — the document</div>
      <div class="cxp-editor-wrap">
        <div id="cxp-doc-gutter" class="cxp-gutter" aria-hidden="true"></div>
        <pre class="cxp-editor-render" aria-hidden="true"><code id="cxp-doc-render" class="language-cx"></code></pre>
        <textarea id="cxp-doc" class="cxp-source" spellcheck="false" aria-labelledby="cxp-doc-label"
                  autocorrect="off" autocapitalize="off" wrap="soft"></textarea>
      </div>
    </div>
    <div id="cxp-prog-block" class="cxp-edit-block cxp-prog-block">
      <div class="cxp-edit-label" id="cxp-prog-label">prog.cx — the program</div>
      <div class="cxp-editor-wrap">
        <div id="cxp-input-gutter" class="cxp-gutter" aria-hidden="true"></div>
        <pre class="cxp-editor-render" aria-hidden="true"><code id="cxp-input-render" class="language-cx"></code></pre>
        <textarea id="cxp-input" class="cxp-source" spellcheck="false" aria-labelledby="cxp-prog-label"
                  autocorrect="off" autocapitalize="off" wrap="soft"
                  placeholder="// Loading…"></textarea>
      </div>
    </div>
  </section>
  <section class="cxp-pane cxp-output-pane">
    <div class="cxp-pane-head">
      <span>OUTPUT</span>
      <span class="cxp-tabs" role="tablist">
        <button class="cxp-tab is-active" data-tab="cx"   type="button">CX</button>
        <button class="cxp-tab"           data-tab="json" type="button">JSON</button>
        <button class="cxp-tab"           data-tab="xml"  type="button">XML</button>
      </span>
      <button id="cxp-format" class="cxp-mini-btn" type="button" title="Toggle pretty / minified output across all tabs">Pretty</button>
    </div>
    <div id="cxp-out-cx"   class="cxp-output is-active">
      <div class="cxp-gutter" aria-hidden="true"></div>
      <pre><code class="language-cx"></code></pre>
    </div>
    <div id="cxp-out-json" class="cxp-output">
      <div class="cxp-gutter" aria-hidden="true"></div>
      <pre><code class="language-json"></code></pre>
    </div>
    <div id="cxp-out-xml"  class="cxp-output">
      <div class="cxp-gutter" aria-hidden="true"></div>
      <pre><code class="language-xml"></code></pre>
    </div>
    <!-- The fixture's own recorded answer, beside the live one: the primer
         and this page show the same program, and the verdict says whether
         the engine in this tab reproduced the fixture. -->
    <div id="cxp-expect" class="cxp-expect" hidden>
      <div class="cxp-expect-head"><span>FIXTURE EXPECTS</span><span id="cxp-verdict" class="cxp-verdict"></span></div>
      <pre><code id="cxp-expect-text" class="language-cx"></code></pre>
    </div>
  </section>
  <section class="cxp-pane cxp-viz-pane">
    <div class="cxp-pane-head">
      <span>VIEW</span>
      <span class="cxp-tabs cxp-subject-group" role="tablist"
            title="Choose the subject: the text you wrote, the value it produced, or both">
        <button class="cxp-subject-tab is-active" data-subject="source" type="button">Source</button>
        <button class="cxp-subject-tab"           data-subject="output" type="button">Output</button>
        <button class="cxp-subject-tab"           data-subject="all"    type="button">Both</button>
      </span>
      <span class="cxp-spacer"></span>
      <select id="cxp-detail-select" class="cxp-detail-select"
              aria-label="Detail level"
              title="Detail — how much each Tree row and Graph box shows: attributes, scalar bodies, values">
        <option value="min">min</option>
        <option value="compact" selected>compact</option>
        <option value="full">full</option>
      </select>
      <span class="cxp-tabs" role="tablist">
        <button class="cxp-viz-tab is-active" data-viz="tree"  type="button">Tree</button>
        <button class="cxp-viz-tab"           data-viz="graph" type="button">Graph</button>
      </span>
    </div>
    <div id="cxp-viz-tree" class="cxp-viz-content is-active">
      <p class="cxp-viz-placeholder">Run a program to see its structural tree.</p>
    </div>
    <div id="cxp-viz-graph" class="cxp-viz-content">
      <div class="cxp-graph-bar">
        <span class="cxp-tabs" role="tablist"
              title="Graph subject — Auto: the INFERRED SHAPE (one box per element NAME for data, control flow for code). Instance: one box per element OCCURRENCE, a table of its own attribute values.">
          <button class="cxp-gview-tab is-active" data-gview="auto"     type="button" title="The shape the diagram module infers for this source (ERD / CFG / SEQ) — the label to the right says which and why">Auto</button>
          <button class="cxp-gview-tab"           data-gview="erd"      type="button" title="Force the DATA SHAPE: one entity per element name">Data</button>
          <button class="cxp-gview-tab"           data-gview="cfg"      type="button" title="Force the CONTROL FLOW: branches, loops, calls (code sources)">Flow</button>
          <button class="cxp-gview-tab"           data-gview="seq"      type="button" title="Force the SEQUENCE diagram: async, worker and channel steps over time">Sequence</button>
          <button class="cxp-gview-tab"           data-gview="effects"  type="button" title="Which capabilities the program reaches, through which call path">Effects</button>
          <button class="cxp-gview-tab"           data-gview="instance" type="button" title="One box per element OCCURRENCE, from the parsed tree">Instance</button>
        </span>
        <span id="cxp-gkind" class="cxp-gkind" title="Which shape the Auto view inferred, and why"></span>
        <span class="cxp-spacer"></span>
        <button id="cxp-graph-zoom-out" class="cxp-mini-btn" type="button" title="Zoom out">−</button>
        <button id="cxp-graph-fit"      class="cxp-mini-btn" type="button" title="Reset zoom">⊙</button>
        <button id="cxp-graph-zoom-in"  class="cxp-mini-btn" type="button" title="Zoom in">+</button>
      </div>
      <div class="cxp-graph-canvas">
        <p class="cxp-viz-placeholder">Run a program to see its diagram.</p>
      </div>
    </div>
  </section>
</main>
<footer id="cxp-status" class="cxp-status" aria-live="polite">
  Loading <code>libcx.wasm</code>…
</footer>
<script src="wasm/cxlib.js" defer></script>
<script src="playground/playground.primer.js" defer></script>
<!-- The playground's own audited corpus (examples.cxd): not in the picker,
     which lists the primer's fixtures, but still reachable by its stable
     link (#ex=<key>) and still the corpus the diagram and engine sweeps
     grade (RULED: 1170-d's page-sourced pins read it). -->
<script src="playground/playground.examples.js" defer></script>
<script src="highlight/highlight.js" defer></script>
<!-- Mermaid, VENDORED (#1007): the Graph view's renderer at a pinned
     version (scripts/gen_guide/playground/vendor/README.md is the pin of
     record), the same bytes the diagram validity gate parses against.
     Ordered before playground.js and both `defer`, so window.mermaid is
     present by the time the page initialises. -->
<script src="playground/vendor/mermaid.min.js" defer></script>
<script src="playground/playground.js" defer></script>
</body>
</html>
