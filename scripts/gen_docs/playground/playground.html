<div id="cx-playground">
  <div class="cxp-toolbar">
    <label for="cxp-pick">Example</label>
    <select id="cxp-pick">
      <option value="atom">CX  1. Atom — element with one attribute</option>
      <option value="attrs">CX  2. Attributes — typed, sized, sigil-flagged</option>
      <option value="sigils">CX  3. Sigils — id, anchor, merge, data-type</option>
      <option value="table">CX  4. Typed table — orders</option>
      <option value="merge">CX  5. Anchor + merge — shared defaults</option>
      <option value="mixed">CX  6. Mixed content — prose + markup</option>
      <option value="multi-doc">CX  7. Multi-document — two menus in one file</option>
      <option value="cxl-substitute">CXL  8. Substitute a value</option>
      <option value="cxl-for">CXL  9. Iterate with [?for]</option>
      <option value="cxl-if">CXL 10. Multi-branch [?if]</option>
      <option value="cxl-let">CXL 11. Let — bind once, reuse</option>
      <option value="cxl-filters">CXL 12. Filter pipeline — trim + upper</option>
      <option value="cxl-templates">CXL 13. Named template — ?def + ?use</option>
      <option value="cxl-paths">CXL 14. CXPath — axes and predicates</option>
      <option value="cxl-merge">CXL 15. cx:merge — three-policy semantic merge</option>
      <option value="cxl-includes">CXL 16. Include — partial composition</option>
    </select>
    <button id="cxp-run" type="button">Run</button>
    <button id="cxp-reset" type="button">Reset</button>
  </div>
  <div class="cxp-panes">
    <div class="cxp-pane-header"><span>Source</span><span id="cxp-source-lang">cx</span></div>
    <textarea id="cxp-input" class="cxp-input" spellcheck="false"></textarea>
    <div class="cxp-output">
      <div class="cxp-tab-bar">
        <button class="cxp-tab is-active" data-tab="cx" type="button">Canonical CX</button>
        <button class="cxp-tab" data-tab="json" type="button">JSON</button>
        <button class="cxp-tab" data-tab="xml" type="button">XML</button>
      </div>
      <pre id="cxp-out-cx" class="cxp-pane is-active"><code class="language-cx"></code></pre>
      <pre id="cxp-out-json" class="cxp-pane"><code class="language-json"></code></pre>
      <pre id="cxp-out-xml" class="cxp-pane"><code class="language-xml"></code></pre>
    </div>
  </div>
  <p class="cxp-note">The Run button surfaces pre-recorded outputs for the closest matching example today; the live libcx-WASM evaluator lands in the v0.7.x window. Edits in the Source pane survive the page session — switch examples via the dropdown to load a fresh starter.</p>
</div>
<link rel="stylesheet" href="/playground/playground.css">
<script src="/playground/playground.js" defer></script>
