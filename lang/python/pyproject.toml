[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cxlib"
version = "0.17.0"
description = "CX format library — parse, stream, and convert CX/XML/JSON/YAML/TOML"
readme = "cxlib/README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["cx", "markup", "xml", "json", "yaml", "toml", "parser"]

# Arrow C-Data interop is optional — pyarrow is a heavy dep we do not
# pull in for vanilla cxlib users. `pip install cxlib[arrow]` enables
# `cxlib.arrow.export(...)` / `cxlib.arrow.import_to_data_bin(...)`
# (spec/abi.md §2.11, capability bit 0x800000).
[project.optional-dependencies]
arrow = ["pyarrow>=14"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cxlib*"]
