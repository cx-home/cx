[package]
name = "cxlib"
version = "0.16.0"
edition = "2021"
description = "CX format library — thin wrapper around libcx"

[profile.release]
opt-level = "s"      # size over speed (matches V's -Os choice)
lto = true           # link-time optimisation — dead code elimination across crates
codegen-units = 1    # single codegen unit for better LTO
strip = true         # strip symbols from the binary

[dependencies]
serde_json = "1"
# I1 L48 (identity epoch): decimal and bigint are first-class semantic
# kinds with their own data-bin wire tags (0x28 / 0x18). Host mapping is
# normative per spec/03-approved/misc/type-mapping.md — decimal =
# bigdecimal::BigDecimal (arbitrary precision; NOT rust_decimal, whose
# 96-bit form cannot represent the wire image), bigint =
# num_bigint::BigInt.
bigdecimal = "0.4"
num-bigint = "0.4"
# Apache Arrow C-Data interop — opt-in via `--features arrow` so the default
# build stays light. Mirrors Python's `pip install cxlib[arrow]` and Go's
# `-tags arrow` patterns. Pulls in `libcx_arrow` at link time (see build.rs).
arrow = { version = "53", optional = true, default-features = false, features = ["ffi", "ipc"] }
# Parquet bridge (X-row / v0.7.0). Same major as the `arrow` crate.
# Opt-in via `--features parquet` (implies arrow).
parquet = { version = "53", optional = true, default-features = false, features = ["arrow", "snap"] }

[features]
default = []
arrow = ["dep:arrow"]
parquet = ["arrow", "dep:parquet"]

[[example]]
name = "parquet_smoke"
required-features = ["parquet"]

[[bin]]
name = "bench_time"
path = "src/bin/bench_time.rs"

[[bin]]
name = "binding_api_driver"
path = "src/bin/binding_api_driver.rs"
