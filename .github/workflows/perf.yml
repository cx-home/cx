name: Perf (V7)

# V7 — performance regression gate per spec/v0_7_0_status.md V row.
#
# Nightly run of `make bench-streaming` (via scripts/run_bench_json.py),
# JSON result uploaded as a workflow artifact. The 'compare' job
# downloads the most recent main-branch artifact and runs
# scripts/compare_bench.py against it; a regression past the
# default 30% threshold fails the job. The 30% threshold absorbs
# the ±15-20% noise floor of GitHub-hosted runners — see
# docs/perf.md (TODO) for the strict-mode baseline discipline.
#
# This workflow is gated on its own runner image so the baseline
# stays meaningful. If the runner image changes (e.g., ubuntu-22.04
# → 24.04) the baseline must be regenerated by a maintainer via
# the `workflow_dispatch` "publish-baseline" path.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily — before US workday starts
  workflow_dispatch:
    inputs:
      publish_baseline:
        description: 'Promote this run as the new baseline (overrides drift check)'
        required: false
        default: 'false'

jobs:
  bench:
    name: Run streaming bench + upload artifact
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        run: |
          git clone --depth=1 https://github.com/vlang/v /tmp/v
          (cd /tmp/v && make && sudo ./v symlink)

      - name: Build libcx
        run: make build-vcx

      - name: Run bench (JSON)
        run: |
          mkdir -p out
          # --include-eval also runs the T1 evaluator-feature bench
          # so the artifact carries every v0.7.0 perf signal in one
          # JSON blob.
          python3 scripts/run_bench_json.py --include-eval -o out/bench.json
          cat out/bench.json

      - name: Upload bench artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.run_id }}
          path: out/bench.json
          retention-days: 90

  compare:
    name: Compare against latest baseline
    needs: bench
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    continue-on-error: true  # informational until a stable baseline is published
    steps:
      - uses: actions/checkout@v4

      - name: Download current bench
        uses: actions/download-artifact@v4
        with:
          name: bench-${{ github.run_id }}
          path: out

      - name: Locate most-recent baseline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the most recent successful run of THIS workflow on
          # main that produced a `bench-*` artifact. We tag the
          # "current baseline" by convention with workflow_dispatch
          # publish_baseline=true — fall back to the previous nightly
          # if no manual baseline is set.
          gh run list --workflow=perf.yml --branch=main --status=success \
            --limit 30 --json databaseId,createdAt \
            > runs.json
          echo "Recent successful main runs:"; cat runs.json

      - name: Compare (informational)
        run: |
          if [ -f bench/baseline.json ]; then
            python3 scripts/compare_bench.py bench/baseline.json out/bench.json
          else
            echo "No committed baseline at bench/baseline.json — skipping compare."
            echo "To establish one, run workflow_dispatch with publish_baseline=true"
            echo "and commit the resulting bench.json to bench/baseline.json."
          fi
