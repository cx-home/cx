name: Reproducibility (BB3)

# BB3 — reproducibility check in CI per spec/v0_7_0_status.md BB row
# and docs/reproducible_builds.md.
#
# Builds the release artifacts twice with `SOURCE_DATE_EPOCH` fixed
# to the head commit's timestamp and asserts both runs produce the
# same SHA-256 set. A drift indicates non-determinism in the build
# pipeline that the BB1 toolchain pin missed.
#
# Triggers:
#   - On version tag push (release-time gate; ideally matches
#     dist/SHA256SUMS.txt when BB4 lands).
#   - Weekly cron so determinism doesn't silently regress between
#     releases.
#   - Manual workflow_dispatch for ad-hoc verification.

on:
  push:
    tags: ['v*.*.*']
  schedule:
    - cron: '17 4 * * 1'  # Mondays 04:17 UTC
  workflow_dispatch: {}

jobs:
  double-build:
    name: Build twice + diff SHA256SUMS
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install V
        run: |
          git clone --depth=1 https://github.com/vlang/v /tmp/v
          (cd /tmp/v && make && sudo ./v symlink)
          v version

      - name: First build
        run: |
          scripts/reproduce_release.sh
          mv dist/SHA256SUMS.reproduced.txt /tmp/SHA256SUMS.run1.txt

      - name: Second build (clean)
        run: |
          make clean
          scripts/reproduce_release.sh
          mv dist/SHA256SUMS.reproduced.txt /tmp/SHA256SUMS.run2.txt

      - name: Diff
        run: |
          if ! diff -u /tmp/SHA256SUMS.run1.txt /tmp/SHA256SUMS.run2.txt; then
            echo "FAIL: reproducible-build hashes drifted between two runs."
            echo "See docs/reproducible_builds.md → 'Mismatch investigation'."
            exit 1
          fi
          echo "OK: build is byte-identical across two clean runs."

      - name: Upload SHA256SUMS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sha256sums-${{ github.sha }}
          path: |
            /tmp/SHA256SUMS.run1.txt
            /tmp/SHA256SUMS.run2.txt
