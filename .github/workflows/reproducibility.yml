name: Reproducibility (BB3)

# Reproducibility check in CI (historical BB3 gate from v0.7.0 status;
# carried forward into v0.8.0). See docs/reproducible_builds.md.
#
# Builds the release artifacts twice with `SOURCE_DATE_EPOCH` fixed
# to the head commit's timestamp and asserts both runs produce the
# same SHA-256 set. A drift indicates non-determinism in the build
# pipeline that the BB1 toolchain pin missed.
#
# Triggers:
#   - On version tag push (release-time gate; ideally matches
#     dist/SHA256SUMS.txt when BB4 lands).
#   - Weekly cron so determinism doesn't silently regress between
#     releases.
#   - Manual workflow_dispatch for ad-hoc verification.

# Manual-only: org GitHub Actions runners are unavailable (jobs fail at startup;
# org billing/runner allocation). Tag-push + cron auto-triggers removed so it
# stops failing red. Re-add them once runners are restored.
on:
  workflow_dispatch: {}

jobs:
  double-build:
    name: Build twice + diff SHA256SUMS
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install V
        run: |
          git clone --depth=1 https://github.com/vlang/v /tmp/v
          (cd /tmp/v && make && sudo ./v symlink)
          v version
          sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev
          make -C third_party/v

      # The build needs deps/ and deps/ needs a cx (the bootstrap of release.yml): the released
      # cx, installed OUTSIDE the tree, runs the pin transport and the runner itself — make clean
      # removes deps/cx-core-code/vcx/target, so the runner cannot be the tree's own build.
      - name: Install the released cx + synchronise the pins
        run: |
          PREFIX="$RUNNER_TEMP/cx-bootstrap" CX_PROFILE=cli sh docs/install
          make deps-sync CX_BIN="$RUNNER_TEMP/cx-bootstrap/bin/cx"

      - name: First build
        run: |
          "$RUNNER_TEMP/cx-bootstrap/bin/cx" --allow-all scripts/reproduce_release.cx
          mv dist/SHA256SUMS.reproduced.txt /tmp/SHA256SUMS.run1.txt

      - name: Second build (clean)
        run: |
          make clean
          "$RUNNER_TEMP/cx-bootstrap/bin/cx" --allow-all scripts/reproduce_release.cx
          mv dist/SHA256SUMS.reproduced.txt /tmp/SHA256SUMS.run2.txt

      - name: Diff
        run: |
          if ! diff -u /tmp/SHA256SUMS.run1.txt /tmp/SHA256SUMS.run2.txt; then
            echo "FAIL: reproducible-build hashes drifted between two runs."
            echo "See docs/reproducible_builds.md → 'Mismatch investigation'."
            exit 1
          fi
          echo "OK: build is byte-identical across two clean runs."

      - name: Upload SHA256SUMS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sha256sums-${{ github.sha }}
          path: |
            /tmp/SHA256SUMS.run1.txt
            /tmp/SHA256SUMS.run2.txt
