name: Site

# cxhome.org — the ONE site, built from this repository's own tree and deployed
# by GitHub Pages (RULED: RS-28 / D57a, D58a; RS-30; D86b). `make site`
# assembles site/ (scripts/gen_site/site.mk) and `make site-check` lists it
# against docs-src/site/manifest.cxd before anything is uploaded.
#
# It runs in cx-home/cx only. The same file sits in cx-private, whose tree the
# public cx is filtered from, and the `if:` below keeps it from ever running
# there. Pages must be pointed at this workflow once (Settings → Pages →
# Source: GitHub Actions, i.e. build_type=workflow); until then Pages keeps
# serving main:/docs, where the tracked landing page docs/index.html already is.
#
# #1670: this used to bootstrap by installing a RELEASED cx (`sh docs/install`)
# and running `make deps-sync` with it before `make build-vcx` — cheap, but it
# made cxhome.org depend on a release existing and being loadable, and
# v0.17.0 was neither (its darwin asset dyld-aborted before main, #1102/#1670).
# The chicken-and-egg #1670 measured: `make build-vcx` refuses without deps/
# present (`deps-present`; RS-12's extraction moved vcx/ itself into the
# cx-core-code pin, and its stdlib_bundle.v `$embed_file()`s bundled sources
# straight out of `deps/<repo>/` at compile time — no cx, however small,
# builds without deps/ first), and `make deps-sync` is itself a CX program
# that needs a cx to run. scripts/deps_bootstrap.sh breaks the cycle with a
# plain git clone of each deps.cxd pin (no cx involved — see its header for
# why that is shell, not CX): deps/ populated -> `make build-vcx` succeeds
# with nothing installed -> the cx it just built runs `make deps-sync` for
# real (verifies every pin, `bundle_check.cx`'s half too) -> the rest is a
# developer's first build (README.md). Proved end-to-end on a clean clone
# with /nix hidden from PATH — see _gate_evidence/pipeline_1670/RESULTS.md.
#
# The runner stays Apple Silicon for parity with the release build this same
# tree cuts (scripts/release.sh); nothing here depends on a released asset
# any more, so an ubuntu runner would work too if org runner allocation ever
# needs it split by cost — not changed here, out of #1670's scope.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'cx-home/cx'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the vendored V toolchain
        run: make -C third_party/v

      - name: Bootstrap deps/ with no cx (#1670)
        env:
          CX_DEPS_TOKEN: ${{ secrets.CX_DEPS_TOKEN }}
        run: sh scripts/deps_bootstrap.sh

      - name: Build cx (deps/ present, no release needed)
        run: make build-vcx

      - name: Sync + verify the pinned repositories with the cx just built
        run: make deps-sync CX_BIN=deps/cx-core-code/vcx/target/cx

      - name: Assemble the site
        run: make site

      - name: List the site against its manifest
        run: make site-check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.repository == 'cx-home/cx'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
