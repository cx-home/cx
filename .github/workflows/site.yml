name: Site

# cxhome.org — the ONE site, built from this repository's own tree and deployed
# by GitHub Pages (RULED: RS-28 / D57a, D58a; RS-30; D86b). `make site`
# assembles site/ (scripts/gen_site/site.mk) and `make site-check` lists it
# against docs-src/site/manifest.cxd before anything is uploaded.
#
# It runs in cx-home/cx only. The same file sits in cx-private, whose tree the
# public cx is filtered from, and the `if:` below keeps it from ever running
# there. Pages must be pointed at this workflow once (Settings → Pages →
# Source: GitHub Actions, i.e. build_type=workflow); until then Pages keeps
# serving main:/docs, where the tracked landing page docs/index.html already is.
#
# #1670: this used to bootstrap by installing a RELEASED cx (`sh docs/install`)
# and running `make deps-sync` with it before `make build-vcx` — cheap, but it
# made cxhome.org depend on a release existing and being loadable, and
# v0.17.0 was neither (its darwin asset dyld-aborted before main, #1102/#1670).
# The chicken-and-egg #1670 measured: `make build-vcx` refuses without deps/
# present (`deps-present`; RS-12's extraction moved vcx/ itself into the
# cx-core-code pin, and its stdlib_bundle.v `$embed_file()`s bundled sources
# straight out of `deps/<repo>/` at compile time — no cx, however small,
# builds without deps/ first), and `make deps-sync` is itself a CX program
# that needs a cx to run. scripts/deps_bootstrap.sh breaks the cycle with a
# plain git clone of each deps.cxd pin (no cx involved — see its header for
# why that is shell, not CX): deps/ populated -> `make build-vcx` succeeds
# with nothing installed -> the cx it just built runs `make deps-sync` for
# real (verifies every pin, `bundle_check.cx`'s half too) -> the rest is a
# developer's first build (README.md). Proved end-to-end on a clean clone
# with /nix hidden from PATH — see _gate_evidence/pipeline_1670/RESULTS.md.
#
# The runner stays Apple Silicon for parity with the release build this same
# tree cuts (scripts/release.sh); nothing here depends on a released asset
# any more, so an ubuntu runner would work too if org runner allocation ever
# needs it split by cost — not changed here, out of #1670's scope.

# PLAY-1 (2026-09-28): the playground's wasm engine is a REQUIRED artifact of
# this workflow. Run 36375144472 shipped 0 of its 5 files — emcc is not on
# GitHub's macOS runner — so cxhome.org/playground loaded and answered 404 for
# wasm/cxlib.js: a page with no engine. The job now installs the Emscripten
# SDK at the version devbox.json pins (the one pin; the emsdk checkout is the
# tag of that same version, cached per version), builds the engine with
# `make guide-wasm` before the docs flow, lists the site with the five wasm
# files required (CX_SITE_REQUIRE_WASM=1 → docs-src/site/manifest.cxd's
# required-when=), and before uploading anything
# loads the ASSEMBLED site in headless Chrome and runs every primer example
# in the page (`make test-playground-primer PLAYGROUND_ROOT=site`).
#
# A dispatch on any other ref (`gh workflow run site.yml --ref <branch>`)
# builds and tests exactly this and does NOT deploy: `deploy` runs only for
# refs/heads/main.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'cx-home/cx'
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the vendored V toolchain
        run: make -C third_party/v

      - name: Bootstrap deps/ with no cx (#1670)
        env:
          CX_DEPS_TOKEN: ${{ secrets.CX_DEPS_TOKEN }}
        run: sh scripts/deps_bootstrap.sh

      - name: Build cx (deps/ present, no release needed)
        run: make build-vcx

      - name: Sync + verify the pinned repositories with the cx just built
        run: make deps-sync CX_BIN=deps/cx-core-code/vcx/target/cx

      - name: Read the pinned Emscripten version (devbox.json is the one pin)
        id: emsdk
        run: |
          v="$(jq -r '.packages.emscripten' devbox.json)"
          case "$v" in
            ''|null|latest) echo "devbox.json pins no Emscripten version (got '$v')"; exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache the Emscripten SDK
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.emsdk.outputs.version }}

      - name: Install the pinned Emscripten SDK
        env:
          EMSDK_VERSION: ${{ steps.emsdk.outputs.version }}
        run: |
          set -eu
          if [ ! -x "$HOME/emsdk/emsdk" ]; then
            git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
          . "$HOME/emsdk/emsdk_env.sh"
          emcc --version | head -1
          echo "$HOME/emsdk" >> "$GITHUB_PATH"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$HOME/emsdk/.emscripten" >> "$GITHUB_ENV"

      - name: Build the playground's wasm engine and render the guide with it
        run: make guide-wasm

      # The documentation flow, docs-src/flow/docs.flow.cx, in --mode=check —
      # the same document `make docs` and the post-merge doc pipeline run
      # (RULED CICD-1); its assemble step runs site-check. The engine was
      # built above, so here the manifest's wasm block is REQUIRED
      # (required-when=CX_SITE_REQUIRE_WASM, PLAY-1): a site missing any of
      # its five files is red before anything uploads.
      - name: The docs flow — check every generated document, assemble and list site/ with the five wasm files required
        env:
          CX_SITE_REQUIRE_WASM: '1'
        run: make docs-flow

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the playground gates' dev dependency (jsdom)
        run: npm --prefix scripts/playground-gate ci --no-audit --no-fund

      - name: The page's navigation and readings (jsdom, the shipped page)
        run: make test-playground-nav

      - name: No primer or corpus example traps the engine (node)
        run: make test-playground-wasm-traps

      - name: The assembled site in headless Chrome — the engine loads, the page prints on load, every primer example answers as its fixture records
        run: make test-playground-primer PLAYGROUND_ROOT=site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.repository == 'cx-home/cx' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
