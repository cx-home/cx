name: CI

# Manual-only: org GitHub Actions runners are unavailable (jobs fail at startup
# with no runner; org billing/runner allocation). Auto-triggers removed so CI
# stops failing red on every push. Re-add `push:`/`pull_request:` once runners
# are restored (e.g. a self-hosted runner). Gate runs locally via `make test`.
on:
  workflow_dispatch: {}

jobs:
  test-matrix:
    name: ${{ matrix.os }} / ${{ matrix.lang }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14]
        # Active binding set per decision d-2026-05-22-03 (v0.8.0).
        # Archived bindings (typescript/java/kotlin/csharp/ruby/swift) live
        # in lang/_archived/ and are not CI-tested. Restore via lang/_archived/README.md.
        lang: [vcx, python, go, rust]

    steps:
      - uses: actions/checkout@v4

      - name: Install V (CX core language)
        run: |
          git clone --depth=1 https://github.com/vlang/v /tmp/v
          (cd /tmp/v && make && sudo ./v symlink)
          v version

      - name: Set up Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Set up Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }

      - name: Set up Rust
        if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Build libcx
        run: make build-vcx

      - name: Run binding test
        run: make test-${{ matrix.lang }}

  experience-gate:
    name: Experience gate (F1–F9)
    runs-on: ubuntu-22.04
    needs: test-matrix
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        run: |
          git clone --depth=1 https://github.com/vlang/v /tmp/v
          (cd /tmp/v && make && sudo ./v symlink)

      - name: Build cx
        run: make build-vcx

      - name: Verify examples (F4)
        run: make verify-examples

      - name: Verify README blocks (F6)
        run: make verify-readme-blocks

      - name: Verify doc blocks
        run: make verify-doc-blocks

      - name: Verify doc links
        run: make verify-doc-links

      - name: Verify binding quickstarts (F7)
        run: make verify-binding-quickstarts

      - name: Run smoke-eval
        run: make smoke-eval

      - name: V fork divergence inventory (V2)
        run: make check-v-fork

      - name: Pre-commit lint rules (V6)
        run: make check-lint-rules

      # v0.8.0 — ADR 0037 gate 37.10 (code_diagram / code_tree fixtures).
      - name: code_diagram / code_tree conformance (gate 37.10)
        run: make test-code-diagram

  v0_8_0-gates:
    name: v0.8.0 release gates (28.5a / 28.6)
    runs-on: ubuntu-22.04
    needs: experience-gate
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        run: |
          git clone --depth=1 https://github.com/vlang/v /tmp/v
          (cd /tmp/v && make && sudo ./v symlink)

      - name: Build cx
        run: make build-vcx

      # Gate 28.5a — CXPath / XPath 3.1 alignment, CX side (RULED: VC-7, #945).
      # NOT continue-on-error: this half needs no Docker and is green on the
      # tree, so a red here is a real regression. The step used to run
      # `make test-xpath-parity` under continue-on-error, which is how a gate
      # that had never executed a single case went unnoticed for months.
      # Gate 28.5b (the Saxon-HE cross-check) is MANUAL by ruling and is
      # deliberately not a CI step — see conformance/GATE_REGISTER.md.
      - name: CXPath / XPath 3.1 alignment, CX side (gate 28.5a)
        run: make test-xpath-parity-cx

      # Gate 28.6 — Layer-1 binding-API parity. Runner stub until Phase 3
      # bindings land per spec/v0_8_0_status.md gate 28.6.
      - name: Layer-1 binding-API parity (gate 28.6)
        run: make test-binding-api-parity
        continue-on-error: true

  cold-install:
    name: Cold install + first demo (F1, F2, F5)
    runs-on: ubuntu-22.04
    needs: experience-gate
    steps:
      - uses: actions/checkout@v4

      # Future: download a published binary from the GitHub release
      # and assert install + cx demo < 60s. Until the install script
      # is hosted, this job builds from source and times `cx demo`.
      - name: Build cx
        run: |
          git clone --depth=1 https://github.com/vlang/v /tmp/v
          (cd /tmp/v && make && sudo ./v symlink)
          make build-vcx

      - name: cx demo within 60s and deterministic
        run: |
          start=$(date +%s%N)
          ./vcx/target/cx demo > /tmp/demo.txt
          end=$(date +%s%N)
          elapsed_ms=$(( (end - start) / 1000000 ))
          if [ $elapsed_ms -gt 60000 ]; then
              echo "FAIL: cx demo took ${elapsed_ms}ms (>60s)"
              exit 1
          fi
          echo "OK: cx demo finished in ${elapsed_ms}ms"

  guide:
    name: Guide build + docs-example gate (#425)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        run: |
          git clone --depth=1 https://github.com/vlang/v /tmp/v
          (cd /tmp/v && make && sudo ./v symlink)

      - name: Build cx
        run: make build-vcx

      # Fail-loud render: guide_build.cx exits non-zero naming the file
      # on any section parse failure (no more silently-partial sites).
      - name: Build the guide
        run: make guide GUIDE_SKIP_CX_BUILD=1

      - name: All 16 guide section pages present
        run: |
          missing=0
          for p in quickstart intro data-language surfaces identity analytics \
                   code bindings tooling concepts migration glossary faq \
                   comparison tour-data tour-programs; do
            if [ ! -f "docs/guide/$p.html" ]; then
              echo "MISSING docs/guide/$p.html"; missing=1
            fi
          done
          exit $missing

      # Docs-example gate: every [example lang=cx] snippet in
      # docs-src/canonical/sections/ runs clean on the built binary
      # (check=none opts out deliberately-illustrative fragments).
      - name: Docs-example gate
        run: make guide-snippets-check GUIDE_SKIP_CX_BUILD=1
