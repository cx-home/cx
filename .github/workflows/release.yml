# Release workflow — version-agnostic. Triggers on a `vX.Y.Z` tag push (or
# manual dispatch) and produces, then publishes to the GitHub release:
#   - per-OS/arch binary tarballs (cx CLI + libcx + cx.h)
#   - the four §4 profile binaries (data, cli, embed, platform), each built
#     FROM THE PINS
#   - dist/SHA256SUMS.txt
#   - cx-conformance-<tag>.zip
#
# FROM THE PINS (#1589 item 23, RULED: RS-7). `deps.cxd` names every repository
# this one builds on at a sha. `make deps-sync` fetches each into `deps/` and
# composes the bundled CX sources of the modules whose repositories have left
# this tree, so what the four builds compile is the pinned set and nothing else.
# A stale pin or a missing `deps/<repo>` FAILS the job — RS-7's transport never
# warns, and `$embed_file` fails the compile by name if the composition is
# bypassed, so no arrangement here produces a quietly smaller binary.
#
# ONE RELEASE, on this repository. The allowlist mirror that used to carry a
# second one retired with the split (RULED: RS-11).
#
# Build contract (must match the local build, see vcx/README + third_party/README):
#   CX builds against the PATCHED V FORK in third_party/v (NOT stock vlang/v) —
#   the fork supplies the `-gc e`/vgc runtime + the macOS hardened-runtime `-prod`
#   GC fix. The fork is checked out via `submodules: recursive` and BUILT here so
#   the Makefile picks up third_party/v/v (and thus `-prod`). RE2 (a C++ system
#   dep) is required by the regex shim.

name: release

# Manual-only: org GitHub Actions runners are unavailable (jobs fail at startup;
# org billing/runner allocation). Releases are cut LOCALLY via `make cut-release`
# / scripts/release.sh. The build logic below is correct + ready; re-add the
# `push: tags: ['v*.*.*']` trigger once runners are restored (e.g. a self-hosted
# runner) to make tag-push auto-publish. Test first: `gh workflow run release.yml
# -f tag=vX.Y.Z`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.11.0)'
        required: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-22.04
          - target: linux-aarch64
            os: ubuntu-22.04-arm     # GitHub-hosted arm64 runner (GA 2025)
          - target: macos-aarch64
            os: macos-14
          # macos-x86_64 dropped: GitHub retired the free macos-13 x86 runners
          # (Apple Silicon is the macOS baseline). Re-add on a paid runner if a
          # macOS-Intel artifact is required.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build tools (RE2 is vendored — third_party/re2, #573)
        run: |
          if [ "$RUNNER_OS" != "macOS" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential libsqlite3-dev
          fi

      - name: Build the patched V fork (third_party/v)
        run: |
          make -C third_party/v            # produces third_party/v/v
          third_party/v/v version

      # The pins, before anything is compiled from them. `deps-sync` is the
      # fetch AND the composition; `deps-check` then asserts the tree is where
      # deps.cxd says, writing nothing. Both refuse; neither warns.
      - name: Synchronise the pins (fetch + compose the bundled CX sources)
        run: |
          make build-vcx                   # the bootstrap cx that reads deps.cxd
          make deps-sync
          make deps-check

      - name: Build libcx + cx CLI (-prod, against the fork, from the pins)
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          make build-vcx                   # uses third_party/v/v automatically
          make build-lib-arrow || echo "::warning::libcx_arrow build skipped (optional module)"

      # The four §4 builds (cx_partition.md §4: data, cli, embed, platform).
      # `build-profiles` is the -prod matrix; the monolith built above is the
      # platform profile. They compile the same composed tree, so a module that
      # arrived through a pin is in all four or in none.
      - name: Build the four profiles from the pins
        run: make build-profiles

      - name: Package
        run: |
          T="${{ matrix.target }}"
          TAG="${{ inputs.tag || github.ref_name }}"
          mkdir -p "dist/$T"
          cp vcx/target/cx "dist/$T/"
          for p in data cli embed; do
            [ -x "vcx/target/profiles/$p/cx" ] || { echo "the $p profile did not build"; exit 1; }
            mkdir -p "dist/$T/profiles/$p"
            cp "vcx/target/profiles/$p/cx" "dist/$T/profiles/$p/"
          done
          cp vcx/target/profiles/embed/libcx.* "dist/$T/profiles/embed/" 2>/dev/null || true
          cp vcx/target/libcx.dylib "dist/$T/" 2>/dev/null || true
          cp vcx/target/libcx.so   "dist/$T/" 2>/dev/null || true
          cp dist/lib/libcx_arrow.* "dist/$T/" 2>/dev/null || true
          cp include/cx.h "dist/$T/"
          ( cd dist && tar czf "cx-$TAG-$T.tar.gz" "$T/" )

      - name: SHA256SUMS for this target
        run: |
          cd dist
          shasum -a 256 cx-*-${{ matrix.target }}.tar.gz > "SHA256SUMS.${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cx-${{ matrix.target }}
          path: |
            dist/cx-*.tar.gz
            dist/SHA256SUMS.*
          retention-days: 30

  conformance-bundle:
    name: Build conformance bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Assemble conformance/ and the pin document
        run: |
          zip -r "cx-conformance-${{ inputs.tag || github.ref_name }}.zip" conformance deps.cxd -x "*.bak"
      - name: Upload conformance bundle
        uses: actions/upload-artifact@v4
        with:
          name: cx-conformance
          path: cx-conformance-*.zip
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: [build, conformance-bundle]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Canonical SHA256SUMS.txt
        run: |
          mkdir -p dist
          cat artifacts/*/SHA256SUMS.* > dist/SHA256SUMS.txt

      - name: Resolve release notes (per-tag, never hardcoded)
        id: notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          NOTES="RELEASE_NOTES_${TAG}.md"
          if [ -f "$NOTES" ]; then
            echo "path=$NOTES"  >> "$GITHUB_OUTPUT"
            echo "gen=false"    >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$NOTES not found — falling back to auto-generated notes"
            echo "path="        >> "$GITHUB_OUTPUT"
            echo "gen=true"     >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: CX ${{ inputs.tag || github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.gen }}
          files: |
            artifacts/*/cx-*.tar.gz
            artifacts/cx-conformance/cx-conformance-*.zip
            dist/SHA256SUMS.txt
          draft: false
          fail_on_unmatched_files: true
